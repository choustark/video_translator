name: Multi-Platform Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # 允许手动触发

jobs:
  # ==================== macOS 测试 ====================
  test-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install ffmpeg
      run: |
        brew install ffmpeg

    - name: Set up Python
      run: |
        uv venv --python 3.13
        echo "$PWD/.venv/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv pip install -e .
        uv pip install pytest pytest-asyncio

    - name: Run tests
      run: |
        uv run pytest tests/ -v --tb=short -k "not cosyvoice"  # 跳过 CosyVoice 测试

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-macos
        path: |
          .pytest_cache/
          test-results/

  # ==================== Linux 测试 ====================
  test-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install ffmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Set up Python
      run: |
        uv venv --python 3.13
        echo "$PWD/.venv/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv pip install -e .
        uv pip install pytest pytest-asyncio

    - name: Run tests
      run: |
        uv run pytest tests/ -v --tb=short -k "not cosyvoice"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-linux
        path: |
          .pytest_cache/
          test-results/

  # ==================== Windows 测试 ====================
  test-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      run: |
        irm https://astral.sh/uv/install.ps1 | iex
        echo "$env:APPDATA\uv\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Install ffmpeg
      run: |
        winget install ffmpeg

    - name: Set up Python
      run: |
        uv venv --python 3.13
        echo "$PWD\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Install dependencies
      shell: pwsh
      run: |
        uv pip install -e .
        uv pip install pytest pytest-asyncio

    - name: Run Windows platform tests
      shell: pwsh
      run: |
        uv run pytest tests/test_utils/test_platform_utils.py -v --tb=short

    - name: Run ChatTTS tests
      shell: pwsh
      run: |
        uv run pytest tests/test_tts/test_chattts_engine.py -v --tb=short

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-windows
        path: |
          .pytest_cache/
          test-results/
