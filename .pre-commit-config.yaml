# Pre-commit hooks — commit 前自动跑 ruff lint + format
# 安装：uv run pre-commit install（首次配置后执行一次即可，之后每次 commit 自动触发）
# 手动全量跑：uv run pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # rev 必须与 pyproject.toml 里锁定的 ruff 版本对齐，避免本地/CI 规则漂移
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]   # lint + 自动修复（导入排序、unused import 等）
      - id: ruff-format
