[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-translator"
version = "0.1.0"
description = "Apple Silicon 英文视频翻译为中文配音的桌面工具"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.6",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "tenacity>=8.2",
    "pydub>=0.25",
    "psutil>=7.0",
    "httpx[socks]>=0.27",
    "mlx-whisper>=0.4; sys_platform == 'darwin'",
    "faster-whisper>=1.0; sys_platform != 'darwin'",
    "edge-tts>=7.0",
    "python-dotenv>=1.0",
    "audioop-lts>=0.2.2",
]

[project.optional-dependencies]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio",
    "ruff",
    "mypy>=2.0",
    "types-pyyaml>=6.0.12.20260510",
    "types-psutil>=7.2.2.20260508",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
